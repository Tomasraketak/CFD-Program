name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Qt and VTK both need to render without a display.
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries
        # libGLU is required by the gmsh wheel; libOSMesa gives VTK a
        # software renderer; the xcb libraries are what Qt's offscreen
        # platform plugin links against.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libglu1-mesa libosmesa6 libegl1 libxrender1 libxcursor1 \
            libxft2 libxinerama1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q --timeout=300
